version: "3.8"

services:

  # API Node.js  
  api:
    build:
      context: .
      dockerfile: api/src/Dockerfile
    container_name: conversor-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: conversor
      DB_PASSWORD: conversor123
      DB_NAME: conversor
      RABBITMQ_URL: amqp://conversor:conversor123@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: videos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # Broker de Mensagens (RabbitMQ)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: conversor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: conversor
      RABBITMQ_DEFAULT_PASS: conversor123
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Painel web (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object Storage (Silo - Fork do MinIO)
  minio:
    image: pgsty/silo:latest
    container_name: conversor-silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # API S3 / Downloads
      - "9001:9001" # Console web (http://localhost:9001)
    volumes:
      - silo_data:/data
      
  worker:
    build:
      context: .
      dockerfile: worker/src/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: conversor
      DB_PASSWORD: conversor123
      DB_NAME: conversor
      RABBITMQ_URL: amqp://conversor:conversor123@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: videos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123  
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Banco de Dados para estado dos Jobs
  postgres:
    image: postgres:16-alpine
    container_name: conversor-postgres
    environment:
      POSTGRES_DB: conversor
      POSTGRES_USER: conversor
      POSTGRES_PASSWORD: conversor123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conversor -d conversor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor SMTP para e-mails de teste
  mailpit:
    image: axllent/mailpit:latest
    container_name: conversor-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Webmail (http://localhost:8025)



volumes:
  postgres_data:
  silo_data: